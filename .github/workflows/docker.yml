name: Tests and Docker Hub
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt
      - name: Check app.py formatting
        run: |
          pip install black==26.5.1
          black --check --diff app.py
      - run: python -m unittest -v test_app.py test_diagnostics.py test_auth.py test_nintendo.py test_nintendo_routes.py test_oidc.py test_catalog.py test_blocked_alerts.py test_notification_center.py test_security.py test_adguard_group.py
      - run: python test_http.py
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check frontend syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          code = re.search(r'<script>(.*?)</script>', Path('index.html').read_text(), re.S).group(1)
          Path('/tmp/frontend.js').write_text(code)
          PY
          node --check /tmp/frontend.js
          node --check assets/client-settings.js
          node --check assets/app-shell.js
          node --check assets/identity.js
          node --check assets/appearance-catalog.js
          node --check assets/authentik.js
          node --check assets/blocked-notifications.js
          node --check assets/notification-center.js
          node --check assets/notifications.js
          node --check assets/notification-targets.js
          node --check assets/app-badges.js
          node --check assets/service-logos.js
          node --check sw.js
          node test_ui.cjs
          node test_pwa.cjs
          node test_notifications.cjs
          node test_notification_pipeline.cjs
          node test_badges_targets.cjs
      - name: Verify desktop and mobile controls in a browser
        run: |
          npm install --prefix /tmp/adguard-browser-deps --no-save playwright@1.62.1
          NODE_PATH=/tmp/adguard-browser-deps/node_modules timeout 120s node test_browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-previews
          path: /tmp/adguard-ui-review/*.png
          if-no-files-found: ignore
      - name: Verify container dependencies and writable data
        run: |
          python test_compose.py
          docker build -t parental:ci .
          docker run --rm --read-only --tmpfs /tmp --tmpfs /data:uid=10001,gid=10001 --env DEMO=true --entrypoint python parental:ci -c "import app, oidc, jwt, pynintendoparental, pynintendoauth; from zoneinfo import ZoneInfo; ZoneInfo('Europe/Madrid'); assert not app.AUTHENTIK.login_enabled(); assert len(app.DEVICE_ICONS)==91; assert len(app.auth.AVATARS)==81; assert not app.NINTENDO.public_config()['configured']; assert (app.ROOT/'assets/fonts/InterVariable.woff2').read_bytes()[:4]==b'wOF2'; assert (app.ROOT/'assets/icons/tv.svg').read_text(); app.NINTENDO.close()"
  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify Docker Hub configuration
        env:
          HUB_USER: ${{ vars.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$HUB_USER" || { echo 'Configure repository variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$HUB_TOKEN" || { echo 'Configure repository secret DOCKERHUB_TOKEN'; exit 1; }
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/parental
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
